# ============================================================
# Fermentation Monitor — Mosquitto Broker Configuration
# ============================================================

# ── Listener ─────────────────────────────────────────────────
listener 1883 0.0.0.0
# Use 0.0.0.0 to accept connections from LAN (ESP32 on WiFi).
# Change to 127.0.0.1 if broker and ESP32 are on the same machine only.

# ── Persistence ──────────────────────────────────────────────
# Messages queued for offline subscribers survive a broker restart.
persistence true
persistence_location /tmp/mosquitto-fermentation/
autosave_interval 60

# ── Retained Messages ─────────────────────────────────────────
# The firmware publishes with RETAIN=1 (set in PubSubClient).
# New subscribers (dashboard, recorder on reconnect) receive the
# last known reading immediately rather than waiting up to 30 s.
# No mosquitto.conf change needed — retention is a per-message flag.
# This comment documents the intent; see firmware task F10.

# ── Logging ───────────────────────────────────────────────────
log_dest stdout
log_dest file /tmp/mosquitto-fermentation/mosquitto.log
log_type error
log_type warning
log_type notice
log_type subscribe
log_timestamp true

# ── Clean Session notes ───────────────────────────────────────
# clean_session is set per-client in firmware / recorder, not here.
# ESP32 publisher  → clean_session = true  (stateless, no queuing needed)
# Python recorder  → clean_session = false (persistent: broker queues
#                    messages while recorder is briefly offline, delivers
#                    them on reconnect — no data loss)
# Client IDs must be unique and stable for persistent sessions to work.
#   ESP32   → client_id = "fermentation-esp32"
#   Recorder→ client_id = "fermentation-recorder"

# ============================================================
# ── HARDENING (disabled by default — uncomment to activate) ──
# ============================================================

# ── User Management & Password Auth ───────────────────────────
# Step 1: create password file
#   mosquitto_passwd -c backend/passwd esp32
#   mosquitto_passwd    backend/passwd recorder
#
# Step 2: uncomment below
# password_file /path/to/fermentation-monitor/backend/passwd
# allow_anonymous false

# ── ACL — Access Control Lists ────────────────────────────────
# Restricts which client can publish/subscribe to which topic.
# Uncomment password_file above first (ACL requires auth).
#
# acl_file /path/to/fermentation-monitor/backend/acl

# backend/acl content:
# ───────────────────────────────────────────
# user esp32
# topic write fermentation/sensor
#
# user recorder
# topic read fermentation/sensor
# ───────────────────────────────────────────

# ── TLS (port 8883) ───────────────────────────────────────────
# Encrypts MQTT traffic on the LAN. Use self-signed certs (free).
#
# Generate certs (run once):
#   # CA
#   openssl genrsa -out ca.key 2048
#   openssl req -new -x509 -days 3650 -key ca.key -out ca.crt -subj "/CN=FermentCA"
#   # Server
#   openssl genrsa -out server.key 2048
#   openssl req -new -key server.key -out server.csr -subj "/CN=$(hostname -I | awk '{print $1}')"
#   openssl x509 -req -days 3650 -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt
#
# Then uncomment:
# listener 8883 0.0.0.0
# cafile   /path/to/fermentation-monitor/backend/certs/ca.crt
# certfile /path/to/fermentation-monitor/backend/certs/server.crt
# keyfile  /path/to/fermentation-monitor/backend/certs/server.key
# tls_version tlsv1.2
#
# Also: embed ca.crt in firmware (WiFiClientSecure) and update
# paho-mqtt recorder to use tls_set(ca_cert="certs/ca.crt").

# ── Service Management (systemd) ──────────────────────────────
# To run Mosquitto as a system service using this config:
#
#   sudo systemctl stop mosquitto           # stop default instance if running
#   mosquitto -c backend/mosquitto.conf -d  # run with project config (daemon)
#
# Or create a user service unit:
#   ~/.config/systemd/user/fermentation-mqtt.service
#
# [Unit]
# Description=Fermentation Monitor MQTT Broker
# After=network.target
#
# [Service]
# ExecStart=mosquitto -c /path/to/fermentation-monitor/backend/mosquitto.conf
# Restart=on-failure
# RestartSec=5
#
# [Install]
# WantedBy=default.target
#
#   systemctl --user enable fermentation-mqtt
#   systemctl --user start  fermentation-mqtt
#   systemctl --user status fermentation-mqtt
