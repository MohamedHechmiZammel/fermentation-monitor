[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1

[env:wokwi]
extends = env:esp32dev
build_flags =
    -D SIMULATION
    -D MQTT_HOST='"10.0.0.2"'
; In Wokwi --net mode, the host machine is reachable at 10.0.0.2 from the ESP32's perspective.
; Run Mosquitto on the host before starting wokwi-cli.
;
; SIM_PROFILE picks which synthetic fermentation sim_sensors.h generates:
; NORMAL (the default when the flag is absent, so this env is unchanged from
; before), STUCK or CONTAMINATED. Two ways to select a non-default profile:
;
;   1. build one of the dedicated envs below, e.g. `pio run -e wokwi-stuck`,
;      then point wokwi.toml at .pio/build/wokwi-stuck/firmware.{bin,elf}; or
;   2. append the flag to a one-off build of this env:
;      `pio run -e wokwi $PLATFORMIO_BUILD_FLAGS` with
;      PLATFORMIO_BUILD_FLAGS="-D SIM_PROFILE=CONTAMINATED"
;
; Option 1 is preferred: each profile gets its own build directory, so switching
; profiles never leaves a stale object file behind.

[env:wokwi-stuck]
extends = env:wokwi
build_flags = ${env:wokwi.build_flags} -D SIM_PROFILE=STUCK

[env:wokwi-contaminated]
extends = env:wokwi
build_flags = ${env:wokwi.build_flags} -D SIM_PROFILE=CONTAMINATED
