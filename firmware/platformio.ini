[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1

[env:wokwi]
extends = env:esp32dev
build_flags =
    -D SIMULATION
    -D MQTT_HOST='"10.0.0.2"'
; In Wokwi --net mode, the host machine is reachable at 10.0.0.2 from the ESP32's perspective.
; Run Mosquitto on the host before starting wokwi-cli.
